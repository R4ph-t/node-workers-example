projects:
  - name: heroku-2-render
    environments:
      - name: production
        services:
          # Web service — Express API server (replaces Heroku web dyno)
          - type: web
            name: node-workers-web
            runtime: node
            plan: free
            buildCommand: npm install
            startCommand: node server.js
            envVars:
              - key: REDIS_URL
                fromService:
                  name: node-workers-redis
                  type: keyvalue
                  property: connectionString
              - key: NODE_ENV
                value: production

          # Background worker — BullMQ job processor (replaces Heroku worker dyno)
          - type: worker
            name: node-workers-worker
            runtime: node
            plan: free
            buildCommand: npm install
            startCommand: node worker.js
            envVars:
              - key: REDIS_URL
                fromService:
                  name: node-workers-redis
                  type: keyvalue
                  property: connectionString
              - key: NODE_ENV
                value: production

          # Key Value store (replaces Heroku Redis add-on)
          - type: keyvalue
            name: node-workers-redis
            plan: free
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []
