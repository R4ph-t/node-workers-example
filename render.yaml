projects:
  - name: node-workers-example
    environments:
      - name: production
        services:
          # Web service (from Heroku web dyno)
          - type: web
            name: node-workers-example-web
            runtime: node
            plan: starter
            region: oregon
            buildCommand: npm ci
            startCommand: pm2 start pm2.config.cjs --only server --no-daemon --attach
            envVars:
              - key: NODE_ENV
                value: production
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: node-workers-example-cache
                  property: connectionString

          # Background worker (from Heroku worker dyno)
          - type: worker
            name: node-workers-example-worker
            runtime: node
            plan: starter
            region: oregon
            buildCommand: npm ci
            startCommand: pm2 start pm2.config.cjs --only worker --no-daemon --attach
            envVars:
              - key: NODE_ENV
                value: production
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: node-workers-example-cache
                  property: connectionString

          # Key Value (from Heroku Redis add-on)
          - type: keyvalue
            name: node-workers-example-cache
            plan: starter
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
